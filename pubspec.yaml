name: shower_thoughts
description: "Push-to-talk voice notes, transcribed on-device, fully offline."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Persistence: SQLite via drift + FTS5
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # Audio capture
  record: ^5.1.2

  # Filesystem + sharing
  path_provider: ^2.1.4
  share_plus: ^10.0.0

  # FFI to whisper.cpp
  ffi: ^2.1.3

  # iOS-style swipe-to-reveal actions on list tiles.
  flutter_slidable: ^4.0.0

  # Key/value store for user-tunable settings (record-mode toggle, etc.).
  shared_preferences: ^2.3.0

  # Playback of the short start/stop cue tones bundled in assets/sounds/.
  audioplayers: ^6.1.0

dependency_overrides:
  # record 5.2.1 pulls record_platform_interface 1.6.0, but its sibling
  # record_linux 0.7.2 still implements the older `hasPermission(recorderId)`
  # signature and fails to compile against 1.6.0. We ship iOS-only so the
  # Linux impl is irrelevant at runtime, but the Dart kernel snapshot still
  # compiles it. Pin the interface back one minor to keep the federation
  # consistent.
  # 1.2.0 still has a default throw-impl for startStream so record_linux
  # 0.7.2 (which `record` 5.2.x pins by version range) compiles. 1.3.0+ make
  # startStream abstract and break Dart's kernel snapshot for iOS builds.
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen for drift schema + FFI bindings
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  ffigen: ^14.0.0

  # One-shot icon generator. Expands branding/icon_1024.png into every
  # required iOS AppIcon.appiconset size. Dev-only — does not ship.
  flutter_launcher_icons: ^0.14.1

  integration_test:
    sdk: flutter

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "branding/icon_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
    - assets/icon.png
